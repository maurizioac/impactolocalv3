<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImpactoLOCAL - Mi perfil</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-area" aria-label="ImpactoLOCAL, página principal">
        <img src="../imagenes/logo-impactolocal.svg" class="brand-logo" alt="ImpactoLOCAL — Perú: Acción y Confianza">
        <i class="fa-solid fa-sun logo-icon"></i>
        <div class="logo-text">
          <span class="logo-title">ImpactoLOCAL</span>
          <span class="logo-subtitle">PERÚ: ACCIÓN &amp; CONFIANZA</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="index.html" class="admin-login-back-link"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="auth-header-box">
        <h1>Mi perfil</h1>
        <p>Consulta los datos de tu cuenta</p>
      </div>
      <p id="profile-message" class="il-form-msg" role="alert" hidden></p>
      <dl id="profile-data" class="profile-data" hidden>
        <div><dt>ID de cliente</dt><dd id="profile-id"></dd></div>
        <div><dt>Nombre completo</dt><dd id="profile-name"></dd></div>
        <div><dt>Correo electrónico</dt><dd id="profile-email"></dd></div>
        <div><dt>Número telefónico</dt><dd id="profile-phone"></dd></div>
        <div><dt>DNI</dt><dd id="profile-dni"></dd></div>
        <div><dt>Ocupación</dt><dd id="profile-occupation"></dd></div>
      </dl>
      <button id="show-password-button" type="button" class="btn-submit-form" hidden>Cambiar contraseña</button>
      <form id="password-form" class="auth-form" hidden>
        <div class="form-field">
          <label for="password-current">Contraseña actual</label>
          <input id="password-current" type="password" name="actual" autocomplete="current-password" required>
        </div>
        <div class="form-field">
          <label for="password-new">Nueva contraseña</label>
          <input id="password-new" type="password" name="nueva" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label for="password-confirm">Repite la nueva contraseña</label>
          <input id="password-confirm" type="password" name="confirmar" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-submit-form">Guardar contraseña</button>
        <button id="cancel-password-button" type="button" class="profile-logout">Cancelar</button>
      </form>
      <button id="logout-button" type="button" class="profile-logout">Cerrar sesión</button>
    </section>
  </main>
  <script src="../js/nav.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
