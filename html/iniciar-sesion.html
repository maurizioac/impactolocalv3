<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImpactoLOCAL - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-area" aria-label="ImpactoLOCAL, página principal">
                <img src="../imagenes/logo-impactolocal.svg" class="brand-logo" alt="ImpactoLOCAL — Perú: Acción y Confianza">
                <i class="fa-solid fa-sun logo-icon"></i>
                <div class="logo-text">
                    <span class="logo-title">ImpactoLOCAL</span>
                    <span class="logo-subtitle">PERÚ: ACCIÓN & CONFIANZA</span>
                </div>
            </a>
            <div class="header-actions">
                <a href="administradores.html" class="admin-login-back-link"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header-box">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder a la plataforma</p>
            </div>
            <form class="auth-form" data-api="/api/login" data-redirect="descubre.html">
                <div class="form-field">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-submit-form">Iniciar Sesión</button>
            </form>
            <div class="auth-switch">
                <span>¿No tienes una cuenta?</span> <a href="registrar.html">Regístrate aquí</a>
            </div>
        </div>
    </div>
<script src="../js/nav.js"></script>
<script src="../js/forms.js"></script>
</body>
</html>
